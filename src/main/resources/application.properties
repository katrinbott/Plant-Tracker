app.base-url=http://192.168.0.138:8080
app.upload-dir=./uploads/

# Serve static files straight from the source folder so HTML/CSS/JS edits need no rebuild.
# The classpath fallback is what Docker and the packaged jar use, where the file: path is absent.
spring.web.resources.static-locations=file:./src/main/resources/static/,classpath:/static/
spring.web.resources.cache.period=0

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Falls back to hardcoded values locally (e.g. Berlin) if env vars are not set.
app.weather.latitude=${LATITUDE:52.52437}
app.weather.longitude=${LONGITUDE:13.41053}

spring.datasource.url=jdbc:postgresql://localhost:5432/plant_tracker
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# schema.sql uses IF NOT EXISTS so it is safe to run on every startup.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false