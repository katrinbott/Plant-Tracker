name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn package -DskipTests -B

  docker:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Enables advanced Docker features like multi-platform builds and
      # better caching. Always include this before building images in CI.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is created automatically by GitHub for every run —
      # no manual secret setup needed for ghcr.io.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/plants:latest
            ghcr.io/${{ github.repository_owner }}/plants:${{ github.sha }}
          # Reuse cached layers from the previous build to speed things up.
          cache-from: type=gha
          cache-to: type=gha,mode=max
