name: CI

on:
  push:
    branches: [main]

jobs:

  # ── Job 1: Build ────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn package -DskipTests -B

  # ── Job 2: Deploy ───────────────────────────────────────────────────────────
  # Builds the Docker image, pushes it to Azure Container Registry,
  # then tells Container Apps to run the new image.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Authenticates all subsequent Azure steps using a service principal.
      # AZURE_CREDENTIALS is a JSON blob created with:
      #   az ad sp create-for-rbac --name "plants-github-actions" \
      #     --role contributor \
      #     --scopes /subscriptions/<id>/resourceGroups/plants-rg \
      #     --json-auth
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ACR_LOGIN_SERVER = plantsregistry.azurecr.io (your ACR name + .azurecr.io)
      # ACR_USERNAME and ACR_PASSWORD from: az acr credential show --name plantsregistry
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image to ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Both tags pushed: "latest" for convenience, SHA for pinned rollbacks.
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/plants:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/plants:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Updates the Container App to run the exact image from this commit.
      # Using the SHA tag (not "latest") means each deploy is traceable and reversible.
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: plants-rg
          containerAppName: plants-app
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/plants:${{ github.sha }}
